# Publishes the frontend image to GHCR.
#
# The image is built WITHOUT VITE_* build args on purpose. Vite resolves
# import.meta.env.* at build time, so the bundle is baked with the sentinel
# defaults from the Dockerfile and docker-entrypoint.sh substitutes the real
# API URI and Auth0 configuration when the container starts. That is what lets
# a single published image serve any deployment.
name: Deploy to GHCR

on:
  release:
    types: [created]
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set lowercased owner
        id: lowercase_owner
        run: echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ env.LOWER_OWNER }}/frontend:latest
          file: ./Dockerfile
          build-args: |
            NODE_ENV=production
