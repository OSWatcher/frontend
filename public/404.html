<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSWatcher Frontend</title>
  <script>
    // GitHub Pages SPA redirect workaround
    // When a user navigates directly to a route (like /frontend/callback),
    // GitHub Pages serves this 404.html file. This script captures the path
    // and redirects to index.html with the path encoded in the query string.
    // The index.html will then decode it and restore the correct route.

    sessionStorage.redirect = location.href;
  </script>
  <meta http-equiv="refresh" content="0;URL='/frontend/'">
</head>
<body>
  <!-- GitHub Pages 404 - Redirecting to app... -->
</body>
</html>
